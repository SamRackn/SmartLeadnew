[project]
name = "mazz"
version = "0.1.0"
description = "Owned outbound platform: research, personalization and sending"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2.0",
    "alembic",
    "psycopg[binary]",
    "jinja2",
    "python-multipart",
    "pydantic-settings",
    "itsdangerous",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]
# The Claude drafting path. Optional on purpose: the Phase 1 template composer
# must keep importing and testing with nothing installed, which is also what
# keeps the lazy imports in `compose_claude` honest.
ai = ["anthropic"]
# Live sending as the client's own Google Workspace mailboxes. Optional for the
# same reason `ai` is: the stub sender must keep importing and testing with
# nothing installed, which is what keeps GmailSender's lazy imports honest.
google = ["google-api-python-client", "google-auth", "cryptography"]
# The client's lead lists arrive as spreadsheets. Optional like the others so a
# CSV-only deployment stays lean, but the web import route declares it needed:
# openpyxl for .xlsx/.xlsm, xlrd for the legacy .xls some CRMs still emit.
excel = ["openpyxl", "xlrd"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
