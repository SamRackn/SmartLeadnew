# Render blueprint: one web process, one worker, managed Postgres.
# Replaces scripts/launchd.sh (macOS LaunchAgents). Secrets are `sync: false`:
# Render asks for them in its dashboard on first deploy; they never live here.
# Sending stays OFF (SEND_ENABLED=false, EMAIL_SENDER=stub) until the go-live
# gate; flip both in the dashboard, not in this file.

envVarGroups:
  - name: mazz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: SEND_ENABLED
        value: "false"
      - key: EMAIL_SENDER
        value: stub
      - key: DRAFT_COMPOSER
        value: template
      - key: SESSION_SECRET
        sync: false
      - key: OAUTH_TOKEN_KEY
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: UNSUBSCRIBE_BASE_URL
        sync: false
      - key: UNSUBSCRIBE_HOST
        sync: false

services:
  - type: web
    name: mazz-web
    runtime: python
    buildCommand: pip install -e ".[google,excel]"
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn mazz.web.app:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /health
    envVars:
      - fromGroup: mazz
      - key: DATABASE_URL
        fromDatabase: { name: mazz-db, property: connectionString }

  # One worker only: rotation and caps are counted, not locked (pipeline/mailbox.py).
  - type: worker
    name: mazz-worker
    runtime: python
    buildCommand: pip install -e ".[google,excel]"
    startCommand: python -m mazz.ops worker
    envVars:
      - fromGroup: mazz
      - key: DATABASE_URL
        fromDatabase: { name: mazz-db, property: connectionString }

databases:
  - name: mazz-db
    databaseName: mazz
