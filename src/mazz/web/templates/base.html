<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}MazzSmartLead Review{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/leads">MazzSmartLead Review</a>
    {% if user %}
      <nav class="topbar-nav">
        <a href="/review" class="{{ 'active' if request.url.path.startswith('/review') else '' }}">review</a>
        <a href="/leads" class="{{ 'active' if request.url.path.startswith('/leads') and not request.url.path.startswith('/leads/import') else '' }}">leads</a>
        <a href="/outbox" class="{{ 'active' if request.url.path.startswith('/outbox') else '' }}">outbox</a>
        <a href="/removals" class="{{ 'active' if request.url.path.startswith('/removals') else '' }}">removals</a>
        <a href="/leads/import" class="{{ 'active' if request.url.path.startswith('/leads/import') else '' }}">import</a>
        <a href="/workspaces" class="{{ 'active' if request.url.path.startswith('/workspaces') else '' }}">workspaces</a>
        <a href="/mailboxes" class="{{ 'active' if request.url.path.startswith('/mailboxes') else '' }}">mailboxes</a>
        <a href="/dashboard" class="{{ 'active' if request.url.path.startswith('/dashboard') else '' }}">dashboard</a>
      </nav>
      <span class="topbar-user">{{ user }}</span>
      <form method="post" action="/logout" class="inline-form">
        <button type="submit" class="link-button">log out</button>
      </form>
    {% endif %}
  </header>
  <main class="{% block main_class %}{% endblock %}">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
